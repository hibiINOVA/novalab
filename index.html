<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVALAB</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b0f14; color:#e6edf3; font-family:system-ui,sans-serif; }
  .box { text-align:center; }
  .logo { font-size:1.6rem; font-weight:700; letter-spacing:.12em; color:#00ff87; }
  .msg { margin-top:.8rem; opacity:.75; font-size:.95rem; }
  .err { margin-top:1rem; display:none; }
  a { color:#00ff87; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">NOVALAB</div>
  <div class="msg" id="msg">Conectando&hellip;</div>
  <div class="err" id="err">
    <p>No se pudo conectar ahora mismo. Reintenta en unos segundos.</p>
    <p><a href="#" onclick="location.reload(); return false;">Reintentar</a></p>
  </div>
</div>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const err = document.getElementById('err');
  const ok = (u) => typeof u === 'string' && u.startsWith('https://');
  const sources = [
    // 1) mismo Pages (se actualiza en ~1 min tras el push de la Pi)
    () => fetch('./url.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : null),
    // 2) API de GitHub (siempre fresca, con CORS)
    () => fetch('https://api.github.com/repos/hibiINOVA/novalab/contents/url.txt', {
      headers: { Accept: 'application/vnd.github.raw' }
    }).then(r => r.ok ? r.text() : null),
    // 3) raw.githubusercontent (fallback, puede ir con algo de retraso)
    () => fetch('https://raw.githubusercontent.com/hibiINOVA/novalab/main/url.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : null),
  ];
  for (let i = 0; i < 12; i++) {
    for (const src of sources) {
      try {
        const url = ((await src()) || '').trim();
        if (ok(url)) { location.replace(url); return; }
      } catch (_) {}
    }
    msg.textContent = 'Conectando\u2026 (intento ' + (i + 1) + ')';
    await new Promise(res => setTimeout(res, 5000));
  }
  msg.style.display = 'none';
  err.style.display = 'block';
})();
</script>
</body>
</html>
